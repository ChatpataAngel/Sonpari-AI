# Fly.io config for Aiko Bot v28+
# Deploy: fly launch --name aiko-bot --region bom && fly deploy
# Set secrets: fly secrets set TELEGRAM_BOT_TOKEN=... OWNER_ID=... OWNER_CODE=... WEBHOOK_SECRET_TOKEN=... GROQ_API_KEY=... etc.

app = "aiko-bot"
primary_region = "bom"  # Mumbai - change to your region: iad, ord, lax, sin, hkg, nrt, syd, fra, ams, lhr, cdg

[build]
  builder = "paketobuildpacks/builder:base"
  buildpacks = ["gcr.io/paketo-buildpacks/python"]

[env]
  PYTHON_VERSION = "3.11"
  BOT_MODE = "webhook"
  PORT = "8080"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Free allowance: 3 shared-cpu-1x VMs, 160GB bandwidth/month
# This config runs 1 small VM 24/7 within free tier