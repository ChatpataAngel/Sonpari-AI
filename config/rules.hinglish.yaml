reflection_rules:
  \bi feel (.+):
  - '{thing} kyun mehsoos kar rahe ho?'
  - kis cheez ne tumhe {thing} mehsoos karaaya?
  \bi am (.+):
  - kitne samay se {thing} ho?
  - '{thing} hona kaisa lagta hai?'
  \bi'm (.+):
  - kya cheez tumhe {thing} mehsoos kara rahi hai?
  - kitne samay se {thing} ho?
  \bi want (.+):
  - '{thing} se kya cheez tumhe rok rahi hai?'
  - tumhaare liye {thing} ka matlab kya hoga?
  \bi can't (.+):
  - kya tumhe lagta hai ki tum {thing} nahi kar sakte?
  - '{thing} mein sabse mushkil kya lagta hai?'
  \bi think (.+):
  - kya tumhe {thing} sochne par majboor karta hai?
  - kya tum lambe samay se aisa mehsoos kar rahe ho?
  \bi need (.+):
  - '{thing} paane mein kya madad karega?'
  - '{thing} ki taraf ek chhota pehla kadam kya hai?'
