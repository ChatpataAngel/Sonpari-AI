reflection_rules:
- pattern: \bi feel (.+)
  responses:
  - why do you feel {thing}?
  - what made you feel {thing}?
- pattern: \bi am (.+)
  responses:
  - how long have you been {thing}?
  - what's it like being {thing}?
- pattern: \bi'm (.+)
  responses:
  - what's been making you feel {thing}?
  - how long have you been {thing}?
- pattern: \bi want (.+)
  responses:
  - what's stopping you from {thing}?
  - what would {thing} mean to you?
- pattern: \bi can't (.+)
  responses:
  - what makes you think you can't {thing}?
  - what feels hardest about {thing}?
- pattern: \bi think (.+)
  responses:
  - what makes you think {thing}?
  - have you felt that way for long?
- pattern: \bi need (.+)
  responses:
  - what would help you get {thing}?
  - is there a small first step toward {thing}?
