services:
  - type: web
    name: aiko-bot
    env: python
    plan: free
    region: singapore  # or oregon, frankfurt, ohio
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_MODE
        value: webhook
      - key: PORT
        value: "8080"
      - key: HOST
        value: "0.0.0.0"
      # Add these in Render Dashboard → Environment (NOT in this file):
      # TELEGRAM_BOT_TOKEN, GROQ_API_KEY, HF_API_KEY, COHERE_API_KEY, OPENROUTER_API_KEY, TOGETHER_API_KEY
      # OWNER_ID, OWNER_CODE, WEBHOOK_SECRET_TOKEN (required; random 16-256 allowed chars), DB_PATH, LOG_LEVEL, etc.
    healthCheckPath: /health
    autoDeploy: true